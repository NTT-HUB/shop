<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Đăng bán</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header>
    <div class="brand">
      <a href="/">SHOP</a>
      <small>Đăng sản phẩm</small>
    </div>
    <nav>
      <a href="/dashboard.html">Tài khoản</a>
      <a href="/login.html">Đăng nhập</a>
    </nav>
  </header>

  <main class="container">
    <div class="box">
      <h2>Thông tin sản phẩm</h2>
      <label>Loại</label>
      <select id="kind">
        <option value="product">Sản phẩm</option>
        <option value="ac">Tài khoản (AC)</option>
      </select>

      <label>Tên hiển thị</label>
      <input id="title" placeholder="VD: Acc game VIP, Áo hoodie local brand">

      <label>Giá (VND)</label>
      <input id="price" inputmode="numeric" placeholder="Nhập số VND, ví dụ 150000">

      <label>Số lượng</label>
      <input id="qty" inputmode="numeric" placeholder="Mặc định 1 nếu để trống">

      <label>Link liên hệ</label>
      <input id="contact" placeholder="Zalo/Telegram/Website...">

      <label>Mô tả</label>
      <textarea id="description" placeholder="Điểm nổi bật, điều kiện bảo hành..."></textarea>

      <label>Nội dung AC (chỉ cho loại Tài khoản)</label>
      <textarea id="secret" placeholder="User/pass, mã backup... sẽ hiển thị cho người mua sau thanh toán"></textarea>

      <div class="muted">Lưu ý: bạn cần đăng nhập trước khi đăng bán.</div>
      <button id="submitBtn" onclick="create()">Đăng sản phẩm</button>
    </div>
  </main>

  <script src="assets/app.js"></script>
  <script>
    const submitBtn = document.getElementById("submitBtn");

    async function create() {
      submitBtn.disabled = true;
      submitBtn.innerText = "Đang xử lý...";

      const priceValue = sanitizeNumberInput(price.value);
      const qtyValue = sanitizeNumberInput(qty.value || 1);

      if (!title.value.trim()) {
        alert("Vui lòng nhập tên sản phẩm");
        submitBtn.disabled = false;
        submitBtn.innerText = "Đăng sản phẩm";
        return;
      }

      if (priceValue <= 0) {
        alert("Giá phải lớn hơn 0");
        submitBtn.disabled = false;
        submitBtn.innerText = "Đăng sản phẩm";
        return;
      }

      if (qtyValue <= 0) {
        alert("Số lượng phải lớn hơn 0");
        submitBtn.disabled = false;
        submitBtn.innerText = "Đăng sản phẩm";
        return;
      }

      const payload = {
        kind: kind.value,
        title: title.value.trim(),
        description: description.value.trim(),
        price_cents: Math.round(priceValue * 100),
        quantity: Math.max(1, Math.floor(qtyValue || 1)),
        contact_link: contact.value.trim(),
        ac_secret_txt: secret.value.trim()
      };

      const res = await apiPost("/api/listings", payload);
      if (res.ok) {
        alert("Đăng bán thành công");
        location.href = "dashboard.html";
      } else {
        alert(res.error || "Không thể đăng bán, vui lòng thử lại");
        submitBtn.disabled = false;
        submitBtn.innerText = "Đăng sản phẩm";
      }
    }
  </script>
</body>
</html>
