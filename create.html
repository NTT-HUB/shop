<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Đăng bán</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .hide { display: none; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <a href="/">SHOP</a>
    <small>Đăng sản phẩm</small>
  </div>
  <nav>
    <a href="/dashboard.html">Tài khoản</a>
  </nav>
</header>

<main class="container">
  <div class="box">
    <h2>Thông tin sản phẩm</h2>

    <!-- LOẠI -->
    <label>Loại</label>
    <select id="kind" onchange="toggleKind()">
      <option value="product">Sản phẩm</option>
      <option value="ac">Tài khoản (AC)</option>
    </select>

    <!-- TÊN -->
    <label>Tên hiển thị</label>
    <input id="title" placeholder="VD: Acc game VIP, Áo hoodie local brand">

    <!-- GIÁ -->
    <label>Giá trọn gói (VNĐ)</label>
    <input id="price" inputmode="numeric" placeholder="VD: 1.500.000">

    <!-- SỐ LƯỢNG -->
    <div id="qtyBox">
      <label>Số lượng</label>
      <input id="qty" inputmode="numeric" placeholder="VD: 10">
    </div>

    <!-- LIÊN HỆ -->
    <label>Link liên hệ</label>
    <input id="contact" placeholder="Zalo / Telegram / Website">

    <!-- MÔ TẢ -->
    <label>Mô tả</label>
    <textarea id="description" placeholder="Điểm nổi bật, điều kiện bảo hành..."></textarea>

    <!-- AC SECRET -->
    <div id="acBox" class="hide">
      <label>Nội dung AC (chỉ hiển thị cho người mua)</label>
      <textarea id="secret" rows="5"
        placeholder="Username: xxx
Password: yyy
Ghi chú: chưa đổi mail"></textarea>
      <p class="muted">
        ⚠ Nội dung này chỉ hiển thị cho người mua sau khi thanh toán thành công
      </p>
    </div>

    <button id="submitBtn" class="btn primary block" onclick="create()">Đăng sản phẩm</button>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
const priceInput = document.getElementById("price");

// ===== TOGGLE FORM =====
function toggleKind() {
  const isAC = kind.value === "ac";
  acBox.classList.toggle("hide", !isAC);
  qtyBox.classList.toggle("hide", isAC); // AC thường bán 1 lần
}

// ===== FORMAT GIÁ TIỀN =====
priceInput.addEventListener("input", () => {
  const raw = priceInput.value.replace(/\D/g, "");
  if (!raw) {
    priceInput.value = "";
    return;
  }
  priceInput.value = raw.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
});

// ===== CREATE =====
async function create() {
  submitBtn.disabled = true;
  submitBtn.innerText = "Đang xử lý...";

  const priceValue = Number(price.value.replace(/\D/g, ""));
  const qtyValue = Number(qty.value || 1);

  if (!title.value.trim()) {
    alert("Vui lòng nhập tên sản phẩm");
    resetBtn();
    return;
  }

 if (!priceValue || priceValue < 20000) {
  alert("Giá trọn gói tối thiểu là 20.000đ");
  resetBtn();
  return;
}


  if (kind.value === "product" && qtyValue <= 0) {
    alert("Số lượng phải lớn hơn 0");
    resetBtn();
    return;
  }

  if (kind.value === "ac" && !secret.value.trim()) {
    alert("Vui lòng nhập nội dung AC");
    resetBtn();
    return;
  }

  const payload = {
    kind: kind.value,
    title: title.value.trim(),
    description: description.value.trim(),
    price_cents: priceValue * 100,
    quantity: kind.value === "ac" ? 1 : Math.max(1, qtyValue),
    contact_link: contact.value.trim(),
    ac_secret_txt: secret.value.trim()
  };

  const res = await apiPost("/api/listings", payload);

  if (res.ok) {
    alert("Đăng bán thành công");
    location.href = "dashboard.html";
  } else {
    alert(res.error || "Không thể đăng bán");
    resetBtn();
  }
}

function resetBtn() {
  submitBtn.disabled = false;
  submitBtn.innerText = "Đăng sản phẩm";
}

// INIT
toggleKind();
</script>

</body>
</html>
