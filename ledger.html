<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Lịch sử giao dịch</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 2px solid #000;
      padding: 8px;
      text-align: left;
    }
    th {
      background: #f2f2f2;
    }
    .plus {
      color: #0a0;
      font-weight: bold;
    }
    .minus {
      color: #c00;
      font-weight: bold;
    }
    .center {
      text-align: center;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <a href="/">SHOP</a>
    <small>Lịch sử giao dịch</small>
  </div>
  <nav>
    <a href="/dashboard.html">Tài khoản</a>
  </nav>
</header>

<main class="container">
  <div class="box">
    <h2>Lịch sử giao dịch</h2>

    <table>
      <thead>
        <tr>
          <th>Thời gian</th>
          <th>Loại</th>
          <th>Số tiền</th>
          <th>Ghi chú</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr>
          <td colspan="4" class="center muted">Đang tải…</td>
        </tr>
      </tbody>
    </table>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
async function loadLedger() {
  const r = await apiGet("/api/ledger");
  const tbody = document.getElementById("rows");

  tbody.innerHTML = "";

  if (!r.ok || !r.items || r.items.length === 0) {
    tbody.innerHTML = `
      <tr>
        <td colspan="4" class="center muted">Chưa có giao dịch nào</td>
      </tr>
    `;
    return;
  }

  r.items.forEach(i => {
    const isPlus = i.amount_cents > 0;
    const cls = isPlus ? "plus" : "minus";
    const sign = isPlus ? "+" : "";

    tbody.innerHTML += `
      <tr>
        <td>${new Date(i.created_at).toLocaleString("vi-VN")}</td>
        <td>${mapType(i.type)}</td>
        <td class="${cls}">
          ${sign}${formatPrice(Math.abs(i.amount_cents))}
        </td>
        <td>${i.note || ""}</td>
      </tr>
    `;
  });
}

function mapType(t) {
  switch (t) {
    case "deposit": return "Nạp tiền";
    case "purchase": return "Mua hàng";
    case "sale_income": return "Bán hàng";
    case "withdraw": return "Rút tiền";
    case "refund": return "Hoàn tiền";
    case "adjustment": return "Điều chỉnh";
    default: return t;
  }
}

loadLedger();
</script>

</body>
</html>
