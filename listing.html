<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chi tiết sản phẩm</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <div class="brand">
    <a href="/">SHOP</a>
    <small>Chi tiết</small>
  </div>
  <nav>
    <a href="/dashboard.html">Tài khoản</a>
  </nav>
</header>

<main class="container">
  <div class="box">
    <h2 id="title">...</h2>
    <p id="desc" class="muted"></p>

    <div class="meta">
      <div><b>Giá:</b> <span id="price"></span></div>
      <div><b>Tồn kho:</b> <span id="qty"></span></div>
      <div><b>Người bán:</b> <span id="seller"></span></div>
      <div><b>Uy tín:</b> <span id="rep"></span></div>
    </div>

    <div class="buy">
      <input id="buyQty" type="number" min="1" value="1">
      <button onclick="buy()">Mua ngay</button>
    </div>

    <p id="msg" class="muted"></p>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
let listing = null;

async function load() {
  const r = await apiGet("/api/listings/" + id);
  if (!r.ok) {
    alert("Không tìm thấy sản phẩm");
    location.href = "/";
    return;
  }

  listing = r.item;
  title.innerText = listing.title;
  desc.innerText = listing.description || "Không có mô tả";
  price.innerText = formatPrice(listing.price_cents);
  qty.innerText = listing.quantity;
  seller.innerText = listing.seller_username;
  rep.innerText = listing.seller_reputation || 0;
}

async function buy() {
  msg.innerText = "Đang xử lý...";
  const res = await apiPost("/api/orders", {
    listing_id: id,
    quantity: Number(buyQty.value || 1)
  });

  if (!res.ok) {
    msg.innerText = res.error || "Mua thất bại";
    return;
  }

  // 👉 QUAN TRỌNG: redirect sang order.html
  location.href = "/order.html?id=" + res.order_id;
}

load();
</script>
</body>
</html>
