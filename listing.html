<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Chi tiết sản phẩm</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin: 15px 0;
    }
    .buy-box {
      margin-top: 20px;
      border-top: 2px dashed #fff;
      padding-top: 15px;
    }
    .sold {
      color: #f87171;
      font-weight: bold;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
   <a href="/" id="siteName">SHOP</a>
    <small>Chi tiết sản phẩm</small>
  </div>
  <nav>
    <a href="/dashboard.html">Tài khoản</a>
  </nav>
</header>

<main class="container">
  <div class="box">
    <h2 id="title">...</h2>
    <p id="desc" class="muted"></p>

    <!-- META INFO -->
    <div class="meta">
      <div><b>Giá trọn gói:</b> <span id="price"></span></div>
      <div><b>Số lượng:</b> <span id="qty"></span></div>
      <div><b>Tình trạng:</b> <span id="status"></span></div>

      <div>
        <b>Người bán:</b>
        <a id="sellerLink" href="#" style="font-weight:bold"></a>
      </div>

      <div><b>Uy tín:</b> <span id="rep"></span></div>
    </div>

    <!-- BUY BOX -->
    <div id="buyBox" class="buy-box">
      <button class="btn primary block" onclick="confirmBuy()">Mua trọn gói</button>
      <p class="muted">
        • Mua <b>1 lần</b> là mua <b>toàn bộ số lượng</b><br>
        • Giá hiển thị là <b>giá trọn gói</b><br>
        • Sau khi thanh toán, giao dịch không thể hoàn tác
      </p>
    </div>

    <p id="msg" class="muted"></p>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
const id = new URLSearchParams(location.search).get("id");
let listing = null;

// ===== LOAD LISTING =====
async function load() {
  const r = await apiGet("/api/listings/" + id);
  if (!r.ok) {
    alert("Không tìm thấy sản phẩm");
    location.href = "/";
    return;
  }

  listing = r.item;

  title.innerText = listing.title;
  desc.innerText = listing.description || "Không có mô tả";
  price.innerText = formatPrice(listing.price_cents);
  qty.innerText = listing.quantity;

  sellerLink.innerText = listing.seller_username;
  sellerLink.href = "view-profile.html?user=" + encodeURIComponent(listing.seller_username);

  rep.innerText = listing.seller_reputation || 0;

  if (listing.quantity > 0) {
    status.innerHTML = `<span class="muted">Còn hàng</span>`;
  } else {
    status.innerHTML = `<span class="sold">Đã bán</span>`;
    buyBox.innerHTML = `<p class="sold">Sản phẩm này đã được bán.</p>`;
  }
}

// ===== CONFIRM BUY ALL =====
async function confirmBuy() {
  if (!listing) return;

  // đã bán
  if (listing.quantity <= 0 || listing.status === "sold_out") {
    alert("Sản phẩm này đã được bán");
    return;
  }

  // chặn mua của chính mình
  if (listing.is_owner) {
    alert("Bạn không thể mua sản phẩm của chính mình");
    return;
  }

  const ok = confirm(
    "BẠN CÓ CHẮC MUỐN MUA TOÀN BỘ SẢN PHẨM NÀY?\n\n" +
    "• Số lượng: " + listing.quantity + "\n" +
    "• Giá trọn gói: " + formatPrice(listing.price_cents) + "\n\n" +
    "⚠ Giao dịch KHÔNG thể hoàn tác."
  );

  if (!ok) return;

  buyAll();
}


// ===== BUY ALL =====
async function buyAll() {
  if (buying) return;
  buying = true;

  msg.innerText = "⏳ Đang tạo đơn hàng...";
  const btn = buyBox.querySelector("button");
  if (btn) btn.disabled = true;

  const res = await apiPost("/api/orders", {
    listing_id: id,
    buy_all: true
  });

  if (!res.ok) {
    msg.innerText = res.error || "Mua thất bại";
    buying = false;
    if (btn) btn.disabled = false;
    return;
  }

  location.href = "/order.html?id=" + res.order_id;
}


load();
</script>

</body>
</html>
