<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Lịch sử nạp tiền</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    table { width:100%; border-collapse:collapse; }
    th, td { border:2px solid #000; padding:6px; text-align:center; }
    th { background:#000; color:#fff; }
    .pending { color:#d97706; font-weight:bold; }
    .success { color:#16a34a; font-weight:bold; }
    .failed { color:#dc2626; font-weight:bold; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <a href="/">SHOP</a>
    <small>Lịch sử nạp tiền</small>
  </div>
  <nav>
    <a href="/dashboard.html">Tài khoản</a>
    <a href="/deposit.html">Nạp tiền</a>
  </nav>
</header>

<main class="container">
  <div class="box">
    <h2>Lịch sử nạp tiền</h2>

    <table>
      <thead>
        <tr>
          <th>Thời gian</th>
          <th>Hình thức</th>
          <th>Số tiền</th>
          <th>Phí</th>
          <th>Thực nhận</th>
          <th>Trạng thái</th>
        </tr>
      </thead>
      <tbody id="rows">
        <tr><td colspan="6">Đang tải...</td></tr>
      </tbody>
    </table>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
async function loadHistory() {
  const r = await apiGet("/api/deposits/my?_=" + Date.now());
  if (!r.ok) {
    rows.innerHTML = `<tr><td colspan="6">Không thể tải dữ liệu</td></tr>`;
    return;
  }

  if (!r.items.length) {
    rows.innerHTML = `<tr><td colspan="6">Chưa có giao dịch</td></tr>`;
    return;
  }

  rows.innerHTML = r.items.map(d => `
    <tr>
      <td>${new Date(d.created_at).toLocaleString()}</td>
      <td>${d.provider}</td>
      <td>${formatPrice(d.gross)}</td>
      <td>${formatPrice(d.fee)}</td>
      <td>${formatPrice(d.net)}</td>
      <td class="${d.status}">
        ${d.status === "pending" ? "Đang xử lý"
          : d.status === "success" ? "Thành công"
          : "Thất bại"}
      </td>
    </tr>
  `).join("");
}

// load lần đầu
loadHistory();

// REAL-TIME: refresh mỗi 5 giây
setInterval(loadHistory, 5000);
</script>

</body>
</html>
