<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Admin – Users</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #fff;
      padding: 6px 8px;
      white-space: nowrap;
      vertical-align: middle;
    }
    th {
      text-align: left;
      background: #111;
    }
    .banned {
      color: #f87171;
      font-weight: bold;
    }
    .actions {
      display: flex;
      gap: 6px;
    }
    .actions button {
      padding: 4px 8px;
      font-size: 12px;
    }
    .search-box {
      margin-bottom: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .search-box input {
      max-width: 260px;
      margin: 0;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
   <a href="/" id="siteName">SHOP</a>
    <small>Admin – Quản lý người dùng</small>
  </div>
</header>

<main class="container">
  <div class="box">
    <h2>Users</h2>

    <!-- SEARCH -->
    <div class="search-box">
      <input id="q" placeholder="Tìm theo username…">
      <button class="btn" onclick="load()">Tìm</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Status</th>
          <th>Số dư</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
async function load() {
  const keyword = q.value.trim().toLowerCase();
  const r = await apiGet("/api/admin/users");
  if (!r.ok) return alert("Unauthorized");

  let users = r.users || [];

  if (keyword) {
    users = users.filter(u =>
      u.username.toLowerCase().includes(keyword)
    );
  }

  rows.innerHTML = users.map(u => `
    <tr>
      <td>${u.username}</td>
      <td class="${u.status === "banned" ? "banned" : ""}">
        ${u.status}
      </td>
      <td>${formatPrice(u.balance_cents)}</td>
      <td>
        <div class="actions">
          ${
            u.status === "active"
              ? `<button onclick="setStatus('${u.id}','banned')">Ban</button>`
              : `<button onclick="setStatus('${u.id}','active')">Unban</button>`
          }
          <button onclick="adjust('${u.id}', true)">+Tiền</button>
          <button onclick="adjust('${u.id}', false)">-Tiền</button>
        </div>
      </td>
    </tr>
  `).join("");
}

async function setStatus(userId, status) {
  if (!confirm(`${status === "banned" ? "BAN" : "UNBAN"} user này?`)) return;

  const r = await apiPost("/api/admin/users/status", {
    user_id: userId,
    status
  });
  if (!r.ok) return alert(r.error);
  load();
}

async function adjust(userId, add) {
  const amount = prompt(add ? "Nhập số tiền CỘNG (VNĐ):" : "Nhập số tiền TRỪ (VNĐ):");
  if (!amount) return;

  const vnd = Number(amount.replace(/[^0-9]/g,""));
  if (!vnd) return alert("Sai số tiền");

  const note = prompt("Ghi chú (tuỳ chọn):") || "";

  const r = await apiPost("/api/admin/users/balance", {
    user_id: userId,
    amount_cents: (add ? vnd : -vnd) * 100,
    note
  });

  if (!r.ok) return alert(r.error);
  load();
}

load();
</script>

</body>
</html>
