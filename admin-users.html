<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Admin – Users</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #fff;
      padding: 6px 8px;
      vertical-align: middle;
    }
    th {
      text-align: left;
      background: #111;
      white-space: nowrap;
    }
    td {
      white-space: nowrap;
    }
    td.balance {
      white-space: normal;
      min-width: 120px;
    }
    .banned {
      color: #f87171;
      font-weight: bold;
    }
    .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .actions button {
      padding: 4px 8px;
      font-size: 12px;
    }
    .search-box {
      margin-bottom: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-box input {
      max-width: 260px;
      margin: 0;
    }
    .hint {
      color: #aaa;
      font-size: 12px;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <a href="/" id="siteName">SHOP</a>
    <small>Admin – Quản lý người dùng</small>
  </div>
</header>

<main class="container">
  <div class="box">
    <h2>Users (<span id="count">0</span>)</h2>

    <!-- SEARCH -->
    <div class="search-box">
      <input id="q" placeholder="Tìm theo username…">
      <button class="btn" onclick="load()">Tìm</button>
      <button class="btn" onclick="reloadAll()">Reload</button>
    </div>
    <div class="hint" id="hint"></div>

    <table>
      <thead>
        <tr>
          <th>Username</th>
          <th>Status</th>
          <th>Số dư</th>
          <th>Hành động</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
let cached = [];

function pickBalanceCents(u) {
  // hỗ trợ nhiều tên field khác nhau để không bị "trống"
  const candidates = [
    u.balance_cents,
    u.wallet_balance_cents,
    u.wallet_cents,
    u.balance,
    u.wallet_balance
  ];
  for (const v of candidates) {
    const n = Number(v);
    if (Number.isFinite(n)) return n;
  }
  return null; // backend không trả
}

async function reloadAll() {
  q.value = "";
  await load(true);
}

async function load(forceFetch = false) {
  const keyword = q.value.trim().toLowerCase();

  if (forceFetch || cached.length === 0) {
    const r = await apiGet("/api/admin/users?_=" + Date.now());
    if (!r.ok) return alert(r.error || "Unauthorized");
    cached = r.users || [];
  }

  let users = cached;
  if (keyword) {
    users = users.filter(u => (u.username || "").toLowerCase().includes(keyword));
  }

  count.innerText = users.length;

  // cảnh báo nếu backend không trả balance_cents
  const anyHasBalance = users.some(u => pickBalanceCents(u) !== null);
  hint.textContent = anyHasBalance
    ? ""
    : "⚠ API /api/admin/users chưa trả số dư (balance_cents). Trang đang hiển thị 0đ/— để bạn nhận biết.";

  rows.innerHTML = users.map(u => {
    const bal = pickBalanceCents(u);
    const balText = (bal === null) ? "—" : formatPrice(bal);

    return `
      <tr>
        <td>${u.username || "(no username)"}</td>
        <td class="${u.status === "banned" ? "banned" : ""}">
          ${u.status || "unknown"}
        </td>
        <td class="balance">${balText}</td>
        <td>
          <div class="actions">
            ${
              u.status === "active"
                ? `<button onclick="setStatus('${u.id}','banned')">Ban</button>`
                : `<button onclick="setStatus('${u.id}','active')">Unban</button>`
            }
            <button onclick="adjust('${u.id}', true)">+Tiền</button>
            <button onclick="adjust('${u.id}', false)">-Tiền</button>
          </div>
        </td>
      </tr>
    `;
  }).join("");
}

async function setStatus(userId, status) {
  if (!confirm(`${status === "banned" ? "BAN" : "UNBAN"} user này?`)) return;

  const r = await apiPost("/api/admin/users/status", { user_id: userId, status });
  if (!r.ok) return alert(r.error || "Failed");

  await load(true);
}

async function adjust(userId, add) {
  const amount = prompt(add ? "Nhập số tiền CỘNG (VNĐ):" : "Nhập số tiền TRỪ (VNĐ):");
  if (!amount) return;

  const vnd = Number(String(amount).replace(/\D/g, ""));
  if (!vnd) return alert("Sai số tiền");

  const note = prompt("Ghi chú (tuỳ chọn):") || "";

  const r = await apiPost("/api/admin/users/balance", {
    user_id: userId,
    amount_cents: (add ? vnd : -vnd) * 100,
    note
  });

  if (!r.ok) return alert(r.error || "Failed");

  await load(true);
}

load(true);
</script>

</body>
</html>
