<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Admin – Cấu hình hệ thống</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div id="headerMount"></div>
<script src="assets/header.js"></script>


<main class="container">
  <div class="box">
    <h2>Cấu hình hệ thống</h2>

    <!-- ================= WEBSITE ================= -->
    <h3>Website</h3>

    <label>Tên website</label>
    <input id="site_name" placeholder="VD: NTT Market">

    <label>Tagline</label>
    <input id="site_tagline" placeholder="VD: Chợ đồ số – mua bán an toàn">

    <!-- ================= PHÍ ================= -->
    <h3 style="margin-top:20px;">Phí</h3>

    <label>Phí Bank (%)</label>
    <input id="bank_fee_percent" type="number">

    <label>Phí Thẻ (%)</label>
    <input id="card_fee_percent" type="number">

    <!-- ================= BANK INFO ================= -->
    <h3 style="margin-top:20px;">Thông tin ngân hàng (hiển thị)</h3>

    <label>Tên ngân hàng</label>
    <input id="bank_name" placeholder="VD: MB Bank">

    <label>Tên chủ tài khoản</label>
    <input id="bank_account_name" placeholder="VD: NGUYEN VAN A">

    <!-- ================= BANK (WEB2M) ================= -->
    <h3 style="margin-top:20px;">Ngân hàng nạp (Web2M)</h3>

    <label>Token Web2M</label>
    <input id="web2m_token" placeholder="API token">

    <label>Số tài khoản nhận tiền</label>
    <input id="web2m_bank_account" placeholder="0123456789">

    <label>Prefix nội dung chuyển khoản</label>
    <input id="web2m_prefix" placeholder="NAP">

    <!-- ================= CARD ================= -->
    <h3 style="margin-top:20px;">Thẻ cào</h3>

    <label>Provider</label>
    <input id="card_provider" placeholder="VD: thesieure">

    <label>Partner ID</label>
    <input id="card_partner_id">

    <label>API Key</label>
    <input id="card_api_key">

    <label>Domain callback</label>
    <input id="card_callback_domain" placeholder="shop-aaa.pages.dev">

    <button class="btn block" onclick="save()">💾 Lưu cấu hình</button>
    <p id="msg" class="muted"></p>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
async function load() {
  const r = await apiGet("/api/admin/settings?_=" + Date.now());
  if (!r.ok) {
    alert(r.error || "Không có quyền admin");
    return;
  }

  const s = r.settings || {};
  for (const k in s) {
    const el = document.getElementById(k);
    if (el) el.value = s[k];
  }

  // preview header
  if (s.site_name) siteName.innerText = s.site_name;
  if (s.site_tagline) siteTagline.innerText = s.site_tagline;
}

async function save() {
  msg.innerText = "Đang lưu...";

  const body = {
    // site
    site_name: site_name.value,
    site_tagline: site_tagline.value,

    // fee
    bank_fee_percent: bank_fee_percent.value,
    card_fee_percent: card_fee_percent.value,

    // bank display
    bank_name: bank_name.value,
    bank_account_name: bank_account_name.value,

    // web2m
    web2m_token: web2m_token.value,
    web2m_bank_account: web2m_bank_account.value,
    web2m_prefix: web2m_prefix.value,

    // card
    card_provider: card_provider.value,
    card_partner_id: card_partner_id.value,
    card_api_key: card_api_key.value,
    card_callback_domain: card_callback_domain.value
  };

  const r = await apiPost("/api/admin/settings", body);
  if (!r.ok) {
    msg.innerText = r.error || "Lưu thất bại";
    return;
  }

  msg.innerText = "✅ Đã lưu cấu hình thành công";
}

load();
</script>

</body>
</html>
