<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Admin – Cấu hình nạp</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <div class="brand"><a href="/">SHOP</a><small>Admin – Cấu hình nạp</small></div>
  <nav><a href="/admin-dashboard.html">Admin</a></nav>
</header>

<main class="container">
  <div class="box">
    <h2>Cấu hình nạp tiền</h2>

    <h3>Phí</h3>
    <input id="bank_fee_percent" placeholder="Phí bank (%)">
    <input id="card_fee_percent" placeholder="Phí card (%)">

    <h3 style="margin-top:12px;">Bank (Web2M)</h3>
    <input id="web2m_token" placeholder="WEB2M TOKEN">
    <input id="web2m_bank_account" placeholder="STK nhận tiền (mô tả)">
    <input id="web2m_prefix" placeholder="Prefix nội dung (VD: NAP)">

    <h3 style="margin-top:12px;">Card (Thesieure)</h3>
    <input id="card_provider" placeholder="provider (thesieure)">
    <input id="card_partner_id" placeholder="partner_id">
    <input id="card_api_key" placeholder="api_key">
    <input id="card_callback_domain" placeholder="domain callback (VD: shop-aaa.pages.dev)">

    <button class="btn" style="margin-top:10px;" onclick="save()">Lưu</button>
    <div id="msg" class="muted" style="margin-top:10px;"></div>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
async function load() {
  const r = await apiGet("/api/admin/settings");
  if (!r.ok) return alert(r.error || "No admin");

  const s = r.settings || {};
  for (const k in s) {
    const el = document.getElementById(k);
    if (el) el.value = s[k] ?? "";
  }
}
async function save() {
  const body = {
    bank_fee_percent: bank_fee_percent.value,
    card_fee_percent: card_fee_percent.value,
    web2m_token: web2m_token.value,
    web2m_bank_account: web2m_bank_account.value,
    web2m_prefix: web2m_prefix.value,
    card_provider: card_provider.value,
    card_partner_id: card_partner_id.value,
    card_api_key: card_api_key.value,
    card_callback_domain: card_callback_domain.value
  };
  const r = await apiPost("/api/admin/settings", body);
  if (!r.ok) return alert(r.error || "Save failed");
  msg.textContent = "Đã lưu: " + (r.updated || []).join(", ");
}
load();
</script>
</body>
</html>
