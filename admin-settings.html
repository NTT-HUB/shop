<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Admin – Cấu hình nạp tiền</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <div class="brand">
    <a href="/">SHOP</a>
    <small>Admin – Cấu hình nạp tiền</small>
  </div>
  <nav>
    <a href="/admin-dashboard.html">Dashboard</a>
  </nav>
</header>

<main class="container">
  <div class="box">
    <h2>Cấu hình nạp tiền</h2>

    <!-- ================= PHÍ ================= -->
    <h3>Phí</h3>

    <label>Phí Bank (%)</label>
    <input id="bank_fee_percent" type="number" placeholder="VD: 0">

    <label>Phí Thẻ (%)</label>
    <input id="card_fee_percent" type="number" placeholder="VD: 20">

    <!-- ================= BANK ================= -->
    <h3 style="margin-top:20px;">Ngân hàng</h3>

    <label>Tên ngân hàng</label>
    <input id="bank_name" placeholder="VD: MB Bank">

    <label>Tên chủ tài khoản</label>
    <input id="bank_account_name" placeholder="VD: NGUYEN VAN A">

    <label>Số tài khoản</label>
    <input id="bank_account_number" placeholder="0123456789">

    <label>Nội dung chuyển khoản (prefix)</label>
    <input id="bank_transfer_prefix" placeholder="NAP">

    <!-- ================= THẺ CÀO ================= -->
    <h3 style="margin-top:20px;">Thẻ cào</h3>

    <label>Provider</label>
    <input id="card_provider" placeholder="VD: thesieure">

    <label>Partner ID</label>
    <input id="card_partner_id">

    <label>API Key</label>
    <input id="card_api_key">

    <label>Domain callback</label>
    <input id="card_callback_domain" placeholder="shop-aaa.pages.dev">

    <button class="btn block" onclick="save()">Lưu cấu hình</button>
    <p id="msg" class="muted"></p>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
async function load() {
  const r = await apiGet("/api/admin/settings?_=" + Date.now());
  if (!r.ok) {
    alert(r.error || "Không có quyền admin");
    return;
  }

  const s = r.settings || {};
  for (const k in s) {
    const el = document.getElementById(k);
    if (el) el.value = s[k];
  }
}

async function save() {
  const body = {
    bank_fee_percent: bank_fee_percent.value,
    card_fee_percent: card_fee_percent.value,

    bank_name: bank_name.value,
    bank_account_name: bank_account_name.value,
    bank_account_number: bank_account_number.value,
    bank_transfer_prefix: bank_transfer_prefix.value,

    card_provider: card_provider.value,
    card_partner_id: card_partner_id.value,
    card_api_key: card_api_key.value,
    card_callback_domain: card_callback_domain.value
  };

  const r = await apiPost("/api/admin/settings", body);
  if (!r.ok) {
    alert(r.error || "Lưu thất bại");
    return;
  }

  msg.textContent = "✅ Đã lưu cấu hình thành công";
}

load();
</script>

</body>
</html>
