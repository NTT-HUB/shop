<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Admin – Cấu hình nạp tiền</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <div class="brand">
    <a href="/">SHOP</a>
    <small>Admin – Cấu hình nạp tiền</small>
  </div>
  <nav>
    <a href="/admin-dashboard.html">Dashboard</a>
  </nav>
</header>

<main class="container">
  <div class="box">
    <h2>Cấu hình nạp tiền</h2>

    <h3>Phí</h3>
    <label>Phí Bank (%)</label>
    <input id="bank_fee_percent">

    <label>Phí Thẻ (%)</label>
    <input id="card_fee_percent">

    <h3 style="margin-top:15px;">Bank</h3>

    <label>Tên hiển thị ngân hàng</label>
    <input id="bank_display_name" placeholder="VD: MB Bank - NGUYEN VAN A">

    <label>Số tài khoản</label>
    <input id="web2m_bank_account" placeholder="0123456789">

    <label>Nội dung chuyển khoản (prefix)</label>
    <input id="web2m_prefix" placeholder="NAP">

    <label>Web2M Token</label>
    <input id="web2m_token" placeholder="WEB2M TOKEN">

    <h3 style="margin-top:15px;">Thẻ cào</h3>

    <label>Provider</label>
    <input id="card_provider" placeholder="thesieure">

    <label>Partner ID</label>
    <input id="card_partner_id">

    <label>API Key</label>
    <input id="card_api_key">

    <label>Domain callback</label>
    <input id="card_callback_domain" placeholder="shop-aaa.pages.dev">

    <button class="btn block" onclick="save()">Lưu cấu hình</button>
    <p id="msg" class="muted"></p>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
async function load() {
  const r = await apiGet("/api/admin/settings");
  if (!r.ok) return alert(r.error || "No admin");

  const s = r.settings || {};
  for (const k in s) {
    const el = document.getElementById(k);
    if (el) el.value = s[k];
  }
}
async function save() {
  const body = {
    bank_fee_percent: bank_fee_percent.value,
    card_fee_percent: card_fee_percent.value,

    bank_display_name: bank_display_name.value,
    web2m_bank_account: web2m_bank_account.value,
    web2m_prefix: web2m_prefix.value,
    web2m_token: web2m_token.value,

    card_provider: card_provider.value,
    card_partner_id: card_partner_id.value,
    card_api_key: card_api_key.value,
    card_callback_domain: card_callback_domain.value
  };

  const r = await apiPost("/api/admin/settings", body);
  if (!r.ok) return alert(r.error || "Save failed");

  msg.textContent = "Đã lưu cấu hình thành công";
}
load();
</script>

</body>
</html>
