<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Shop</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <h1>SHOP</h1>
  <nav>
    <a href="/login.html">Login</a>
    <a href="/dashboard.html">Dashboard</a>
  </nav>
</header>

<div class="container">
  <div class="list" id="list"></div>
</div>

<div class="footer">© Shop</div>

<script src="assets/app.js"></script>
<script>
async function load() {
  const data = await apiGet("/api/listings");
  const box = document.getElementById("list");
  box.innerHTML = "";
  data.items.forEach(i => {
    box.innerHTML += `
      <div class="item">
        <h3>${i.title}</h3>
        <div class="price">${i.price_cents / 100} đ</div>
        <a href="listing.html?id=${i.id}">Xem chi tiết</a>
      </div>
    `;
  });
}
load();
</script>
</body>
</html>
