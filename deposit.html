<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Nạp tiền</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .tabs { display:flex; gap:10px; margin-bottom:10px; }
    .tab { border:2px solid #000; padding:6px 10px; cursor:pointer; }
    .tab.active { background:#000; color:#fff; }
    .section { display:none; }
    .section.active { display:block; }
    .note { border:2px dashed #000; padding:10px; margin-top:10px; }
    img.qr { max-width:220px; border:2px solid #000; margin-top:10px; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <a href="/">SHOP</a>
    <small>Nạp tiền</small>
  </div>
  <nav>
    <a href="/dashboard.html">Tài khoản</a>
  </nav>
</header>

<main class="container">
  <div class="box">
    <h2>Nạp tiền</h2>

    <div class="tabs">
      <div class="tab active" onclick="showTab('bank')">🏦 Bank</div>
      <div class="tab" onclick="showTab('card')">💳 Thẻ cào</div>
    </div>

    <!-- BANK -->
    <div id="bank" class="section active">
      <label>Số tiền (VNĐ)</label>
      <input id="bank_amount" placeholder="VD: 100000">

      <button class="btn block" onclick="depositBank()">Tạo yêu cầu nạp</button>
      <div id="bank_out"></div>
    </div>

    <!-- CARD -->
    <div id="card" class="section">
      <label>Nhà mạng</label>
      <select id="card_type">
        <option value="">-- Chọn --</option>
        <option>Viettel</option>
        <option>Mobifone</option>
        <option>Vinaphone</option>
      </select>

      <label>Mệnh giá</label>
      <select id="card_amount">
        <option value="">-- Chọn --</option>
        <option value="10000">10.000</option>
        <option value="20000">20.000</option>
        <option value="50000">50.000</option>
        <option value="100000">100.000</option>
        <option value="200000">200.000</option>
        <option value="500000">500.000</option>
      </select>

      <label>Mã thẻ</label>
      <input id="card_code">

      <label>Seri</label>
      <input id="card_serial">

      <button class="btn block" onclick="depositCard()">Nạp thẻ</button>
      <div id="card_out"></div>
    </div>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
function showTab(t) {
  document.querySelectorAll(".tab").forEach(e=>e.classList.remove("active"));
  document.querySelectorAll(".section").forEach(e=>e.classList.remove("active"));
  document.querySelector(`.tab[onclick*="${t}"]`).classList.add("active");
  document.getElementById(t).classList.add("active");
}

async function depositBank() {
  const vnd = Number(bank_amount.value.replace(/[^0-9]/g,""));
  if (!vnd) return alert("Nhập số tiền");

  const r = await apiPost("/api/deposits/create", {
    method: "bank",
    amount_cents: vnd * 100
  });
  if (!r.ok) return alert(r.error);

  const qrText = encodeURIComponent(
    `${r.bank_display_name}\nSTK:${r.bank_account}\nND:${r.pay_code}\nSo tien:${vnd}`
  );

  bank_out.innerHTML = `
    <div class="note">
      <b>Thông tin chuyển khoản</b><br><br>
      <b>Ngân hàng:</b> ${r.bank_display_name}<br>
      <b>Số tài khoản:</b> ${r.bank_account}<br>
      <b>Nội dung:</b> <code>${r.pay_code}</code><br><br>

      <b>Số tiền:</b> ${formatPrice(r.gross_cents)}<br>
      <b>Phí:</b> ${formatPrice(r.fee_cents)}<br>
      <b>Thực nhận:</b> ${formatPrice(r.net_cents)}<br><br>

      <b>QR chuyển khoản:</b><br>
      <img class="qr"
        src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${qrText}">
    </div>
  `;
}

async function depositCard() {
  if (!card_type.value || !card_amount.value || !card_code.value || !card_serial.value)
    return alert("Nhập đầy đủ thông tin thẻ");

  const r = await apiPost("/api/card/submit", {
    card: {
      type: card_type.value,
      amount: Number(card_amount.value),
      code: card_code.value,
      serial: card_serial.value
    }
  });

  if (!r.ok) return alert(r.error || "Nạp thẻ thất bại");

  card_out.innerHTML = `
    <div class="note">
      <b>Đã gửi thẻ thành công</b><br>
      <p class="muted">Thẻ đang được xử lý, tiền sẽ vào ví sau vài giây.</p>
    </div>
  `;
}

</script>

</body>
</html>
