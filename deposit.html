<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Nạp tiền</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .tabs { display:flex; gap:10px; margin-bottom:10px; }
    .tab {
      border:2px solid #000;
      padding:6px 12px;
      cursor:pointer;
      font-weight:bold;
    }
    .tab.active { background:#000; color:#fff; }

    .section { display:none; }
    .section.active { display:block; }

    .note {
      border:2px dashed #000;
      padding:12px;
      margin-top:12px;
      background:#fafafa;
    }

    img.qr {
      max-width:260px;
      border:2px solid #000;
      margin-top:10px;
      background:#fff;
    }

    label { display:block; margin-top:8px; }
    select, input { width:100%; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <a href="/">SHOP</a>
    <small>Nạp tiền</small>
  </div>
  <nav>
    <a href="/dashboard.html">Tài khoản</a>
    <a href="/deposit-history.html">Lịch sử nạp</a>
  </nav>
</header>

<main class="container">
  <div class="box">
    <h2>Nạp tiền</h2>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" onclick="showTab('bank')">🏦 Bank</div>
      <div class="tab" onclick="showTab('card')">💳 Thẻ cào</div>
    </div>

    <!-- BANK -->
    <div id="bank" class="section active">
      <label>Số tiền (VNĐ)</label>
      <input id="bank_amount" placeholder="VD: 100000">

      <button class="btn block" onclick="depositBank()">Tạo yêu cầu nạp</button>

      <div id="bank_out"></div>
    </div>

    <!-- CARD -->
    <div id="card" class="section">
      <label>Nhà mạng</label>
      <select id="card_type">
        <option value="">-- Chọn --</option>
        <option value="Viettel">Viettel</option>
        <option value="Mobifone">Mobifone</option>
        <option value="Vinaphone">Vinaphone</option>
      </select>

      <label>Mệnh giá</label>
      <select id="card_amount">
        <option value="">-- Chọn --</option>
        <option value="10000">10.000</option>
        <option value="20000">20.000</option>
        <option value="50000">50.000</option>
        <option value="100000">100.000</option>
        <option value="200000">200.000</option>
        <option value="500000">500.000</option>
      </select>

      <label>Mã thẻ</label>
      <input id="card_code">

      <label>Seri</label>
      <input id="card_serial">

      <button class="btn block" onclick="depositCard()">Nạp thẻ</button>

      <div id="card_out"></div>
    </div>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
function showTab(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.querySelector(`.tab[onclick*="${tab}"]`).classList.add("active");
  document.getElementById(tab).classList.add("active");
}

/* ================= BANK ================= */
async function depositBank() {
  const vnd = Number(bank_amount.value.replace(/[^0-9]/g,""));
  if (!vnd || vnd < 10000)
    return alert("Số tiền tối thiểu 10.000đ");

  const r = await apiPost("/api/deposits/create", {
    method: "bank",
    amount: vnd
  });

  if (!r.ok) return alert(r.error || "Không thể tạo yêu cầu");

  /*
    API cần trả:
    r.bank_name
    r.bank_account_name
    r.bank_account_number
    r.pay_code
    r.amount
    r.fee
    r.net
  */

  const qrUrl = buildVietQR({
    bank: r.bank_name,
    account: r.bank_account_number,
    name: r.bank_account_name,
    amount: r.amount,
    memo: r.pay_code
  });

  bank_out.innerHTML = `
    <div class="note">
      <b>Thông tin chuyển khoản</b><br><br>

      <b>Ngân hàng:</b> ${r.bank_name}<br>
      <b>Chủ tài khoản:</b> ${r.bank_account_name}<br>
      <b>Số tài khoản:</b> ${r.bank_account_number}<br>
      <b>Nội dung:</b> <code>${r.pay_code}</code><br><br>

      <b>Số tiền:</b> ${formatPrice(r.amount)}<br>
      <b>Phí:</b> ${formatPrice(r.fee)}<br>
      <b>Thực nhận:</b> ${formatPrice(r.net)}<br><br>

      <b>QR chuyển khoản (VietQR / NAPAS)</b><br>
      <img class="qr" src="${qrUrl}"><br>

      <p class="muted">
        Quét QR để chuyển khoản nhanh.<br>
        <b>KHÔNG sửa nội dung chuyển khoản.</b>
      </p>
    </div>
  `;
}

/* VietQR chuẩn */
function buildVietQR({ bank, account, name, amount, memo }) {
  const base = "https://img.vietqr.io/image";
  const bankCode = bank.replace(/\s+/g, "").toLowerCase();
  return `${base}/${bankCode}-${account}-qr_only.png?amount=${amount}&addInfo=${encodeURIComponent(memo)}&accountName=${encodeURIComponent(name)}`;
}

/* ================= CARD ================= */
async function depositCard() {
  if (!card_type.value || !card_amount.value || !card_code.value || !card_serial.value)
    return alert("Vui lòng nhập đầy đủ thông tin thẻ");

  const r = await apiPost("/api/card/submit", {
    card: {
      type: card_type.value,
      amount: Number(card_amount.value),
      code: card_code.value,
      serial: card_serial.value
    }
  });

  if (!r.ok) return alert(r.error || "Nạp thẻ thất bại");

  card_out.innerHTML = `
    <div class="note">
      <b>Đã gửi thẻ thành công</b><br><br>
      <p class="muted">
        Thẻ đang được xử lý tự động.<br>
        Vui lòng chờ vài giây để hệ thống cập nhật số dư.
      </p>
    </div>
  `;
}
</script>

</body>
</html>
