<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Nạp tiền</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    .tabs { display:flex; gap:10px; margin-bottom:10px; }
    .tab { border:2px solid #000; padding:6px 10px; cursor:pointer; }
    .tab.active { background:#000; color:#fff; }
    .section { display:none; }
    .section.active { display:block; }
    input, select { width:100%; margin-top:6px; }
    .note { background:#f5f5f5; padding:10px; border:1px dashed #000; margin-top:10px; }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <a href="/">SHOP</a>
    <small>Nạp tiền</small>
  </div>
  <nav>
    <a href="/dashboard.html">Tài khoản</a>
  </nav>
</header>

<main class="container">
  <div class="box">
    <h2>Nạp tiền</h2>

    <!-- Tabs -->
    <div class="tabs">
      <div class="tab active" onclick="showTab('bank')">🏦 Bank</div>
      <div class="tab" onclick="showTab('card')">💳 Thẻ cào</div>
    </div>

    <!-- BANK -->
    <div id="bank" class="section active">
      <h3>🏦 Nạp qua ngân hàng</h3>

      <label>Tên ngân hàng</label>
      <input id="bank_name" placeholder="VD: MB Bank">

      <label>Số tài khoản</label>
      <input id="bank_number" placeholder="0123456789">

      <label>Số tiền (VNĐ)</label>
      <input id="bank_amount" placeholder="VD: 100000">

      <button class="btn block" onclick="depositBank()">Tạo yêu cầu nạp</button>

      <div id="bank_out"></div>
    </div>

    <!-- CARD -->
    <div id="card" class="section">
      <h3>💳 Nạp thẻ cào</h3>

      <label>Nhà mạng</label>
      <select id="card_type">
        <option value="">-- Chọn --</option>
        <option value="Viettel">Viettel</option>
        <option value="Mobifone">Mobifone</option>
        <option value="Vinaphone">Vinaphone</option>
      </select>

      <label>Mệnh giá</label>
      <select id="card_amount">
        <option value="">-- Chọn --</option>
        <option value="10000">10.000</option>
        <option value="20000">20.000</option>
        <option value="50000">50.000</option>
        <option value="100000">100.000</option>
        <option value="200000">200.000</option>
        <option value="500000">500.000</option>
      </select>

      <label>Mã thẻ</label>
      <input id="card_code" placeholder="Nhập mã thẻ">

      <label>Số seri</label>
      <input id="card_serial" placeholder="Nhập seri">

      <button class="btn block" onclick="depositCard()">Nạp thẻ</button>

      <div id="card_out"></div>
    </div>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
function showTab(tab) {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));

  document.querySelector(`.tab[onclick*="${tab}"]`).classList.add("active");
  document.getElementById(tab).classList.add("active");
}

// ===== BANK =====
async function depositBank() {
  const vnd = Number(bank_amount.value.replace(/[^0-9]/g,""));
  if (!vnd) return alert("Nhập số tiền hợp lệ");

  const r = await apiPost("/api/deposits/create", {
    method: "bank",
    amount_cents: vnd * 100
  });

  if (!r.ok) return alert(r.error || "Lỗi");

  bank_out.innerHTML = `
    <div class="note">
      <b>Tạo yêu cầu thành công</b><br>
      Số tiền: <b>${formatPrice(r.gross_cents)}</b><br>
      Phí: <b>${formatPrice(r.fee_cents)}</b><br>
      Thực nhận: <b>${formatPrice(r.net_cents)}</b><br><br>
      <b>Nội dung chuyển khoản:</b><br>
      <code>${r.pay_code}</code>
    </div>
  `;
}

// ===== CARD =====
async function depositCard() {
  if (!card_type.value || !card_amount.value || !card_code.value || !card_serial.value)
    return alert("Nhập đầy đủ thông tin thẻ");

  // GỬI SANG API GẠCH THẺ (sẽ nối thesieure sau)
  const r = await apiPost("/api/deposits/create", {
    method: "card",
    amount_cents: Number(card_amount.value) * 100,
    card: {
      type: card_type.value,
      code: card_code.value,
      serial: card_serial.value
    }
  });

  if (!r.ok) return alert(r.error || "Lỗi");

  card_out.innerHTML = `
    <div class="note">
      <b>Đã gửi thẻ thành công</b><br>
      Mệnh giá: <b>${formatPrice(r.gross_cents)}</b><br>
      Phí: <b>${formatPrice(r.fee_cents)}</b><br>
      Thực nhận: <b>${formatPrice(r.net_cents)}</b><br>
      <p class="muted">Thẻ sẽ được duyệt tự động.</p>
    </div>
  `;
}
</script>

</body>
</html>
