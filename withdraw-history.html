<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Lịch sử rút tiền</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header>
  <div class="brand">
    <a href="/">SHOP</a>
    <small>Lịch sử rút tiền</small>
  </div>
  <nav>
    <a href="/dashboard.html">Tài khoản</a>
  </nav>
</header>

<main class="container">
  <div class="box">
    <h2>Lịch sử rút tiền</h2>

    <table>
      <thead>
        <tr>
          <th>Số tiền</th>
          <th>Phương thức</th>
          <th>Trạng thái</th>
          <th>Thời gian</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <p id="empty" class="muted" hidden>Chưa có yêu cầu rút nào.</p>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
async function load() {
  const r = await apiGet("/api/my/withdrawals");

  // ❗ CHƯA ĐĂNG NHẬP
  if (!r.ok) {
    location.href = "/login.html";
    return;
  }

  // ❗ KHÔNG CÓ GIAO DỊCH
  if (!r.items || r.items.length === 0) {
    empty.hidden = false;
    rows.innerHTML = "";
    return;
  }

  empty.hidden = true;

  rows.innerHTML = r.items.map(w => `
    <tr>
      <td>${formatPrice(w.amount_cents)}</td>
      <td>${w.method}</td>
      <td>${w.status}</td>
      <td>${new Date(w.created_at).toLocaleString("vi-VN")}</td>
    </tr>
  `).join("");
}

load();
</script>
</body>
</html>
